[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "health-guard-api"
version = "0.1.0"
description = "Health Guard API and real commerce integration boundary"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "apscheduler>=3.11,<4",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=2.0,<3",
  # Drives the merchant checkout that presents Prava's one-time card. This is the only path that
  # can place an order, so it is a core dependency. Also run: playwright install chromium
  "playwright>=1.49",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"] # FastAPI dependencies and formatter-approved long strings.

[tool.setuptools.packages.find]
include = ["app*"]
